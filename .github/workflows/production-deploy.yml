name: Employee Portal - Production deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: employee-portal-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # next.config.ts generates auth/tRPC rewrites during the build.
      NEXT_PUBLIC_SERVER_URL: https://cfs-empoyee-portial-api.abdellahhatouchi.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      # Temporary deployment workaround for OpenNext issue #1355 with Next.js 16.4.
      # Keep the repository lockfile unchanged until compatibility is fixed upstream.
      - name: Pin compatible Next.js for deployment build
        run: bun add --cwd apps/web --exact next@16.3.8
      - name: Run focused access and invitation regressions
        run: bun test scripts/portal-access.test.ts apps/server/src/sync/invitation.test.ts
      - name: Build web worker
        run: bun run --cwd apps/web build:cloudflare
      - name: Verify built API routes before deployment
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const origin = new URL(process.env.NEXT_PUBLIC_SERVER_URL);
          assert.equal(origin.protocol, 'https:');
          const manifest = JSON.parse(readFileSync('apps/web/.next/routes-manifest.json', 'utf8'));
          const rewrites = Array.isArray(manifest.rewrites)
            ? manifest.rewrites
            : Object.values(manifest.rewrites ?? {}).flat();
          for (const path of ['/api/auth/:path*', '/trpc/:path*']) {
            assert(rewrites.some(route => route.source === path && route.destination === `${origin.origin}${path}`), `Missing or incorrect built API route: ${path}`);
          }
          console.log('PASS built authentication and tRPC routes');
          NODE
      - name: Prepare tracked D1 migrations
        run: bun scripts/prepare-production-migrations.ts
      - name: Apply production D1 migrations
        run: node apps/web/node_modules/wrangler/bin/wrangler.js d1 migrations apply cfs-empoyee-portial-production --remote --config apps/server/wrangler.production.jsonc --env production
      - name: Prepare production Worker secrets
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const names = ['BETTER_AUTH_SECRET', 'SYNC_SECRET', 'RESEND_API_KEY'];
          for (const name of names) {
            if (!process.env[name] || process.env[name].length < (name === 'RESEND_API_KEY' ? 10 : 32)) throw new Error(`Missing production secret: ${name}`);
          }
          writeFileSync(`${process.env.RUNNER_TEMP}/portal-production-secrets.json`, JSON.stringify(Object.fromEntries(names.map(name => [name, process.env[name]]))), { mode: 0o600 });
          NODE
      - name: Deploy API to production
        run: node apps/web/node_modules/wrangler/bin/wrangler.js deploy --config apps/server/wrangler.production.jsonc --env production --secrets-file "$RUNNER_TEMP/portal-production-secrets.json"
      - name: Deploy web to production
        run: bunx wrangler deploy --config apps/web/wrangler.production.jsonc --env production
      - name: Verify deployed production routes
        env:
          PORTAL_WEB_URL: https://cfs-empoyee-portial.abdellahhatouchi.workers.dev
        run: node scripts/check-deployed-portal.mjs
      - name: Remove temporary secret file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/portal-production-secrets.json"
