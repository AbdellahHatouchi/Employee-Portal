name: Employee Portal - Linux build check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: employee-portal-linux-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Next.js / OpenNext on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Cloudflare Next.js worker
        run: bun run --cwd apps/web build:cloudflare
