name: Employee Portal - Staging deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: employee-portal-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # next.config.ts generates auth/tRPC rewrites during the build.
      NEXT_PUBLIC_SERVER_URL: https://store-managment-communal-web-api-staging.abdellahhatouchi.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      # Temporary staging-only workaround for OpenNext issue #1355 with Next.js 16.4.
      # Keep the repository lockfile unchanged until compatibility is fixed upstream.
      - name: Pin compatible Next.js for staging build
        run: bun add --cwd apps/web --exact next@16.3.8
      - name: Build web worker
        run: bun run --cwd apps/web build:cloudflare
      - name: Verify built API routes before deployment
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const origin = new URL(process.env.NEXT_PUBLIC_SERVER_URL);
          assert.equal(origin.protocol, 'https:');
          const manifest = JSON.parse(readFileSync('apps/web/.next/routes-manifest.json', 'utf8'));
          const rewrites = Array.isArray(manifest.rewrites)
            ? manifest.rewrites
            : Object.values(manifest.rewrites ?? {}).flat();
          for (const path of ['/api/auth/:path*', '/trpc/:path*']) {
            assert(rewrites.some(route => route.source === path && route.destination === `${origin.origin}${path}`), `Missing or incorrect built API route: ${path}`);
          }
          console.log('PASS built authentication and tRPC routes');
          NODE
      - name: Deploy API to staging
        run: bunx wrangler deploy --config apps/server/wrangler.staging.jsonc --env staging
      - name: Deploy web to staging
        run: bunx wrangler deploy --config apps/web/wrangler.staging.jsonc --env staging
